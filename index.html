<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body style="margin:0; background:#0A0A0C; color:#fff; font-family:sans-serif;">
    <div id="root">
      <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
        <div style="width:40px; height:40px; border:3px solid rgba(59,130,246,0.2); border-top-color:#3b82f6; border-radius:50%; animation:spin 1s linear infinite;"></div>
        <div style="text-align:center;">
          <div style="font-size:12px; font-weight:bold; letter-spacing:0.3em; text-transform:uppercase; color:#3b82f6; margin-bottom:8px;">AuraDB Platform</div>
          <div style="font-size:11px; opacity:0.4; font-style:italic;">Establishing Quantum Link...</div>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      function showError(msg, stack) {
        // Aggressive filter for environment noise (Vite, WebSockets, etc.)
        const noise = ['WebSocket', 'ModuleRunner', 'socket.io', 'HMR', 'reconnect', 'connection'];
        const isNoise = noise.some(n => (msg + '').includes(n));
        
        if (isNoise) {
          console.warn('System noise ignored:', msg);
          return;
        }

        var root = document.getElementById('root');
        if (root) {
          // If we already have the app rendered, don't overwrite it with a red screen for a late background error
          if (root.getAttribute('data-loaded') === 'true') {
            console.error('Late Background Error:', msg, stack);
            return;
          }

          root.innerHTML = '<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0A0A0C; color:#f87171; font-family:sans-serif; padding:20px; text-align:center;">' +
            '<div style="font-size:24px; font-weight:bold; margin-bottom:16px;">System Initialization Failed</div>' +
            '<div style="background:#1a1a1a; padding:16px; border-radius:8px; font-family:monospace; font-size:12px; border:1px solid #ef4444; max-width:800px; text-align:left; overflow:auto;">' +
            '<div style="color:#ef4444; margin-bottom:8px; font-weight:bold;">' + msg + '</div>' +
            '<div style="color:#71717a;">' + (stack || 'No stack trace available') + '</div>' +
            '</div>' +
            '<button onclick="window.location.reload()" style="margin-top:24px; background:#ef4444; border:none; color:#fff; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">Retry Pulse</button>' +
            '</div>';
        }
      }

      window.onerror = function(msg, url, line, col, error) {
        showError(msg, error ? error.stack : 'Line: ' + line + ', Col: ' + col);
        
        // Also log to server
        fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg: msg, url: url, line: line, col: col, stack: error ? error.stack : null })
        }).catch(function(e) { console.error('Reporting failed', e); });
        return false;
      };

      window.onunhandledrejection = function(event) {
        var msg = (event.reason ? (event.reason.message || event.reason) : 'unknown');
        showError('Unhandled Rejection: ' + msg, event.reason ? event.reason.stack : null);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
